name: Deploy to Amazon ECS

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  JAR_BUILD_PATH: "target/kanban-task-management-0.0.1-SNAPSHOT.jar"
  AWS_REGION: "eu-west-1"
  DOCKER_FILE_PATH: "Dockerfile_ci"
  ECS_TASK_DEFINITION_FAMILY: "kanban-task-manager-dev-task"  # Task Definition Family
  CODEDEPLOY_APPLICATION: "kanban-task-manager-dev-codedeploy-app"
  CODEDEPLOY_DEPLOYMENT_GROUP: "kanban-task-manager-dev-deployment-group"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java environment
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
          distribution: "temurin"

      - name: Build & test
        run: mvn clean package --no-transfer-progress -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.KANBAN_BACKEND_OIDC_ROLE_DEV_ARN }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch Application.properties file
        run: |
          mkdir -p src/main/resources
          aws s3 cp s3://terraform-state-kanban-dev/properties/application.properties src/main/resources/
          ls -la src/main/resources/

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: 682033471539.dkr.ecr.eu-west-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY_DEV: ${{ secrets.ECR_REPOSITORY_DEV }}
        run: |
          aws ecr get-login-password --region eu-west-1 | sudo docker login --username AWS --password-stdin 682033471539.dkr.ecr.eu-west-1.amazonaws.com
          sudo docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_DEV:$IMAGE_TAG .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_DEV:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan with Trivy
        id: trivy-scan
        run: |
          sudo trivy image --security-checks vuln \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL \
            ${{ steps.build-image.outputs.image }}
      
      - name: Push image to Amazon ECR
        if: success() # Only push if Trivy scan passes
        run: |
          sudo docker push ${{ steps.build-image.outputs.image }}

      - name: Get latest task definition and update image
        id: update-task-def
        run: |
          # Fetch the latest task definition
          LATEST_TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $LATEST_TASK_DEF_ARN \
            --region ${{ env.AWS_REGION }} \
            --output json)

          # Update the image in the task definition
          UPDATED_TASK_DEF=$(echo $CURRENT_TASK_DEF | \
            jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
            '.taskDefinition.containerDefinitions[0].image = $IMAGE | .taskDefinition')

          # Remove unwanted fields
          UPDATED_TASK_DEF=$(echo $UPDATED_TASK_DEF | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Save to file
          echo "$UPDATED_TASK_DEF" > updated_task_definition.json
          cat updated_task_definition.json
          echo "task-definition=updated_task_definition.json" >> $GITHUB_OUTPUT

      - name: Register updated task definition
        id: register-task-def
        run: |
          EXEC_ROLE_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.executionRoleArn' \
            --output text)

          TASK_ROLE_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskRoleArn' \
            --output text)

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.update-task-def.outputs.task-definition }} \
            --region ${{ env.AWS_REGION }} \
            --execution-role-arn $EXEC_ROLE_ARN \
            --task-role-arn $TASK_ROLE_ARN \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-definition-arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Task definition registered: $TASK_ARN"

      - name: Update AppSpec with latest task definition
        id: update-appspec
        run: |
          # Download AppSpec template from S3
          aws s3 cp s3://terraform-state-kanban-dev/appspecs/appspec.yaml ./appspec-temp.yaml --region ${{ env.AWS_REGION }}

          new_task_def_arn="${{ steps.register-task-def.outputs.task-definition-arn }}"
          sed -i "s|^\([[:space:]]*TaskDefinition:\).*|\1 ${new_task_def_arn}|" ./appspec-temp.yaml

          # Upload updated AppSpec to S3
          TIMESTAMP=$(date +%s)
          UPDATED_APPSPEC_S3_KEY="appspecs/appspec-${TIMESTAMP}.yaml"
          aws s3 cp ./appspec-temp.yaml s3://terraform-state-kanban-dev/${UPDATED_APPSPEC_S3_KEY} --region ${{ env.AWS_REGION }}

          echo "updated-appspec-s3-key=${UPDATED_APPSPEC_S3_KEY}" >> $GITHUB_OUTPUT

      - name: Trigger CodeDeploy Deployment
        id: trigger-codedeploy 
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APPLICATION }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=terraform-state-kanban-dev,key=${{ steps.update-appspec.outputs.updated-appspec-s3-key }},bundleType=YAML \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentId' \
            --output text)

          echo "Deployment started with ID: $DEPLOYMENT_ID"

          # Wait for deployment to complete (optional)
          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID \
            --region ${{ env.AWS_REGION }}
