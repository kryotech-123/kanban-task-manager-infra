version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=kanban_user
      - SPRING_DATASOURCE_PASSWORD=Admin1234!
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_MONGODB_URI=mongodb://kanban_mongo_user:Admin1234!@mongo:27017/kanban_mongo_db?authSource=admin
      - SPRING_DATA_MONGODB_AUTO_INDEX_CREATION=false
    depends_on:
      - postgres
      - mongo
    restart: unless-stopped

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=Admin1234!
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    environment:
      - MONGO_INITDB_ROOT_USERNAME=kanban_mongo_user
      - MONGO_INITDB_ROOT_PASSWORD=Admin1234!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: [--auth]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u kanban_mongo_user -p Admin1234! --quiet | grep 1
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data: