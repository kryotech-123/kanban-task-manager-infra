name: CI/CD with SonarQube Analysis

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for SonarQube to get full git history

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Add SonarQube properties
      working-directory: ./kanban-task-management-backend
      run: |
        # Backup the original pom.xml
        cp pom.xml pom.xml.bak
        
        # Add SonarQube properties in a profile if not already present
        if ! grep -q "<sonar.host.url>" pom.xml; then
          sed -i '/<\/project>/i \
              <profiles>\
                  <profile>\
                      <id>sonar<\/id>\
                      <properties>\
                          <sonar.organization>kryotech-123<\/sonar.organization>\
                          <sonar.host.url>https:\/\/sonarcloud.io<\/sonar.host.url>\
                          <sonar.projectKey>kryotech-123_kanban-task-manager-infra<\/sonar.projectKey>\
                      <\/properties>\
                  <\/profile>\
              <\/profiles>' pom.xml
        fi

    - name: Build and SonarQube Scan
      working-directory: ./kanban-task-management-backend
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B clean verify sonar:sonar \
        -Psonar \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.verbose=true

    