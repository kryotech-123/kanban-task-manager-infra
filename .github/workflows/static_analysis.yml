name: CI/CD with SonarQube Quality Gate

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarQube analysis

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Configure SonarQube Properties
      working-directory: ./kanban-task-management-backend
      run: |
        # Backup the original pom.xml
        cp pom.xml pom.xml.bak
        
        # Use xmlstarlet for safe XML modification (install if needed)
        if ! command -v xmlstarlet &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y xmlstarlet
        fi
        
        # Check if the profile already exists
        if ! xmlstarlet sel -t -v "/project/profiles/profile/id" pom.xml | grep -q "sonar"; then
          # Create temporary file with the profile
          cat << 'EOF' > sonar-profile.xml
          <profile>
            <id>sonar</id>
            <properties>
              <sonar.host.url>${{ secrets.SONAR_HOST }}</sonar.host.url>
              <sonar.projectKey>kanban-task-manager-infra</sonar.projectKey>
              <sonar.qualitygate.wait>true</sonar.qualitygate.wait>
              <sonar.qualitygate.timeout>600</sonar.qualitygate.timeout>
            </properties>
          </profile>
          EOF
          
          # Insert the profile using xmlstarlet
          xmlstarlet ed -L \
            -s "/project" -t elem -n "profiles" -v "" \
            -i "/project/profiles" -t elem -n "profile" -v "" \
            -s "/project/profiles/profile" -t elem -n "id" -v "sonar" \
            -s "/project/profiles/profile" -t elem -n "properties" -v "" \
            -s "/project/profiles/profile/properties" -t elem -n "sonar.host.url" -v "${{ secrets.SONAR_HOST }}" \
            -s "/project/profiles/profile/properties" -t elem -n "sonar.projectKey" -v "kanban-task-manager-infra" \
            -s "/project/profiles/profile/properties" -t elem -n "sonar.qualitygate.wait" -v "true" \
            -s "/project/profiles/profile/properties" -t elem -n "sonar.qualitygate.timeout" -v "600" \
            pom.xml
          
          # Verify the XML is still valid
          xmlstarlet val pom.xml
        fi
        
        # Show the added profile for debugging
        echo "Modified pom.xml profile section:"
        xmlstarlet sel -t -c "/project/profiles" pom.xml

    - name: Build and Run SonarQube Analysis
      working-directory: ./kanban-task-management-backend
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        # Build and run analysis with Quality Gate check
        mvn -B clean verify sonar:sonar \
          -Psonar \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.verbose=true

        # Alternative if you want to see Quality Gate details
        echo "Quality Gate results available at:"
        grep "dashboard url" target/sonar/report-task.txt | cut -d' ' -f3