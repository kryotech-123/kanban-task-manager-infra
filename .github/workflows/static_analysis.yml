name: CI/CD with SonarQube Analysis

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for SonarQube to get full git history

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Add SonarQube properties
      run: |
        # Backup the original pom.xml
        cd kanban-task-management-backend
        cp pom.xml pom.xml.bak
        
        # Add SonarQube properties in a profile
        if ! grep -q "<sonar.host.url>" pom.xml; then
          sed -i '/<\/project>/i \
              <profiles>\
                  <profile>\
                      <id>sonar<\/id>\
                      <properties>\
                          <sonar.organization>kryotech-123<\/sonar.organization>\
                          <sonar.host.url>https:\/\/sonarcloud.io<\/sonar.host.url>\
                      <\/properties>\
                  <\/profile>\
              <\/profiles>' pom.xml
        fi
        
        # Verify the changes
        cat pom.xml | grep -A5 "sonar.organization"

    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed for PR decoration
      run: |
        cd kanban-task-management-backend
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=kryotech-123_kanban-task-manager-infra