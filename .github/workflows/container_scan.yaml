name: Deploy to Amazon ECS

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  JAR_BUILD_PATH: "target/kanban-task-management-0.0.1-SNAPSHOT.jar"
  AWS_REGION: "eu-west-1"
  DOCKER_FILE_PATH: "Dockerfile_ci"
  ECS_TASK_DEFINITION_FAMILY: "kanban-task-manager-dev-task"
  CODEDEPLOY_APPLICATION: "kanban-task-manager-dev-codedeploy-app"
  CODEDEPLOY_DEPLOYMENT_GROUP: "kanban-task-manager-dev-deployment-group"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


     
      - name: Build Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
          #ECR_REPOSITORY_DEV: ${{ secrets.ECR_REPOSITORY_DEV }}
          ECR_REPOSITORY_DEV: "realamponsah/springboot"
        run: |
          cd backend
          sudo docker build -t $$ECR_REPOSITORY_DEV:$IMAGE_TAG .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_DEV:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan with Trivy (Critical Vulnerabilities)
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          vuln-type: 'os,library'
      - name: Display Trivy Report
        if: always()  # Always show report, even if scan fails
        run: |
          echo "=== FULL TRIVY VULNERABILITY REPORT ==="
          echo "${{ steps.trivy-scan.outputs.result }}"
          echo "======================================"

