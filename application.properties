# MongoDB Connection Pool Settings
spring.data.mongodb.client.min-pool-size=0
spring.data.mongodb.client.max-pool-size=10
spring.data.mongodb.client.max-idle-time=30000
spring.data.mongodb.client.max-life-time=300000

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

